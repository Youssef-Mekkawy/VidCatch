[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vidcatch"
dynamic = ["version"]
description = "Download YouTube videos, audio and playlists with a queue, pause/resume and an English/Arabic interface. Runs locally, built on yt-dlp."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "yt-dlp[default]>=2025.10.22",
    "fastapi>=0.115",
    "uvicorn>=0.30",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6", "httpx>=0.27"]

# The main app: a local web server plus the browser UI.
[project.scripts]
vidcatch = "vidcatch.server.launcher:main"

[tool.setuptools.packages.find]
include = ["vidcatch*"]

[tool.setuptools.package-data]
vidcatch = ["web/**/*"]

[tool.setuptools.dynamic]
version = { attr = "vidcatch.__version__" }

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]  # long UI strings and layout calls are fine
